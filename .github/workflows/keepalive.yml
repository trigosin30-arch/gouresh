name: Keep warm

# Pokes the deployed site so a free-tier instance does not spin down.
#
# Setup (once):
#   Repo → Settings → Secrets and variables → Actions → Variables → New variable
#     Name:  SITE_URL
#     Value: https://ankit-stationery-mart.onrender.com
#
# If SITE_URL is unset the job exits immediately without probing anything.
#
# Caveat: GitHub's scheduler is best-effort. Runs can be delayed by 5-15+ minutes
# under load, which is long enough for a 15-minute idle timeout to fire. For a
# tighter loop point a free external monitor (e.g. cron-job.org, UptimeRobot) at
# the same /healthz URL, or move to a paid instance where sleeping is disabled.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check SITE_URL is configured
        id: cfg
        run: |
          if [ -z "${{ vars.SITE_URL }}" ]; then
            echo "SITE_URL variable is not set — nothing to ping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wake the instance (cold start allowed)
        if: steps.cfg.outputs.skip == 'false'
        run: |
          SITE_URL="${{ vars.SITE_URL }}"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 --retry 2 --retry-delay 10 \
                 "${SITE_URL%/}/healthz" || true)
          echo "$SITE_URL/healthz -> $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Health probe returned $code — the service may be down or still starting."
          fi
